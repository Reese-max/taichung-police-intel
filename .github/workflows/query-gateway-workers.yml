name: Deploy GovIntel Query Gateway Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govintel-query-gateway-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Cloudflare deployment credential
        if: ${{ env.HAS_CLOUDFLARE_API_TOKEN != 'true' }}
        run: |
          echo '::error::CLOUDFLARE_API_TOKEN is unavailable; the Worker was not deployed.'
          exit 1

      - name: Deploy Worker
        if: ${{ env.HAS_CLOUDFLARE_API_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config workers/query-gateway/wrangler.jsonc --tag ${{ github.sha }}
