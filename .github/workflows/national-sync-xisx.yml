name: Sync national metadata (xisx-pc)

# Councils that block foreign IPs (runner=xisx-pc in the registry) run on the
# self-hosted Windows runner in Taiwan. Separate concurrency group so an
# offline runner cannot hold up the GitHub-hosted sync.
on:
  schedule:
    # 14:30 Taipei: after the 02:17 UTC hosted run (150 min cap) has finished,
    # so both writers do not draw on the shared UTC-day budget at once.
    - cron: '30 6 * * *'
    # 16:30 Taipei retry in case GitHub drops the first one; --skip-if-ran-today.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch without writing to D1
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: govintel-national-sync-xisx
  cancel-in-progress: false

jobs:
  sync:
    # Never on pull_request: a public repo must not run untrusted code on this host.
    if: vars.NATIONAL_SYNC_ENABLED == 'true' && github.repository == 'Reese-max/taichung-police-intel' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, xisx-pc]
    timeout-minutes: 150
    defaults:
      run:
        # cmd, not powershell: the host ExecutionPolicy blocks runner .ps1 step scripts.
        shell: cmd
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '03d40efd3c60181edea80af8d927ddc1'
      NATIONAL_RUNNER: xisx-pc
      PYTHONUTF8: '1'
    steps:
      - name: Check required network connectivity
        run: >-
          (curl.exe -sS -o NUL --max-time 20 https://api.cloudflare.com || (echo ::error::xisx-pc DNS/connection failure: api.cloudflare.com & exit /b 1)) &&
          (curl.exe -sS -o NUL --max-time 20 https://ifddoc2.tcc.gov.tw/robots.txt || (echo ::error::xisx-pc DNS/connection failure: ifddoc2.tcc.gov.tw & exit /b 1))
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Create Python environment
        run: uv venv --python 3.12 .venv
      - name: Install Python dependencies
        run: uv pip install --python .venv -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.149.0
      - name: Apply idempotent schema
        run: .venv\Scripts\python.exe -X utf8 scripts/national-sync.py --store d1-remote --apply-schema --report reports/national/schema.json
      - name: Check capacity and UTC daily budget
        run: .venv\Scripts\python.exe -X utf8 scripts/national-sync.py --store d1-remote --check-guards --report reports/national/guards.json
      - name: Sync xisx-pc sources
        if: ${{ !inputs.dry_run }}
        run: .venv\Scripts\python.exe -X utf8 scripts/national-sync.py --store d1-remote --report reports/national/sync.json --stop-after-minutes 90 ${{ github.event_name == 'schedule' && github.event.schedule == '30 8 * * *' && '--skip-if-ran-today' || '' }}
      - name: Dry run xisx-pc sources
        if: ${{ inputs.dry_run }}
        run: .venv\Scripts\python.exe -X utf8 scripts/national-sync.py --store d1-remote --dry-run --report reports/national/sync.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: national-sync-xisx-${{ github.run_id }}
          path: reports/national/
          if-no-files-found: warn
