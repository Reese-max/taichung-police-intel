name: Refresh and deploy competition demo

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/public/data/source-status.json"
      - "apps/web/public/data/intelligence-feed.json"
      - "apps/web/public/data/intelligence-summary.json"
      - "apps/web/public/data/feed-export.csv"
      - "apps/web/public/data/v2-daily-brief.json"
      - "state/v2-shadow-state.json"
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Demo refresh slot
        required: true
        type: choice
        options: [morning, evening]
        default: evening

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competition-demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select scheduled slot
        if: github.event_name != 'push'
        id: slot
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "30 22 * * *" ]]; then
            echo "value=morning" >> "$GITHUB_OUTPUT"
          else
            echo "value=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh official-source publication bundle
        if: github.event_name != 'push'
        run: |
          python online_collect.py \
            --slot "${{ steps.slot.outputs.value }}" \
            --demo-output apps/web/public/data/source-status.json \
            --trigger "${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}"

      - name: Verify generated V1 publication bundle
        run: python -X utf8 scripts/verify-publication-bundle.py

      - name: Build persistent V2 daily intelligence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]] \
             || [[ ! -f state/v2-shadow-state.json ]] \
             || [[ ! -f apps/web/public/data/v2-daily-brief.json ]]; then
            python -X utf8 scripts/build-v2-shadow-brief.py \
              --input apps/web/public/data/intelligence-feed.json \
              --source-status apps/web/public/data/source-status.json \
              --state state/v2-shadow-state.json \
              --output apps/web/public/data/v2-daily-brief.json
          else
            echo "Using the checked-in persistent V2 publication for this code-only push."
          fi

      - name: Verify persistent V2 publication
        run: |
          python -X utf8 scripts/verify-v2-publication.py \
            --feed apps/web/public/data/intelligence-feed.json \
            --status apps/web/public/data/source-status.json \
            --state state/v2-shadow-state.json \
            --brief apps/web/public/data/v2-daily-brief.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run full verification gate and build static site
        id: verify_gate
        run: |
          set -o pipefail
          npm run check 2>&1 | tee verify-gate.log
          rc=${PIPESTATUS[0]}
          echo "::set-output name=exit_code::${rc}"
          exit ${rc}
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload verify-gate artifact
        if: always() && hashFiles('verify-gate.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: verify-gate-${{ github.run_id }}
          path: verify-gate.log
          if-no-files-found: ignore

      - name: Preserve V1 and V2 publication evidence as one commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/public/data/source-status.json \
            apps/web/public/data/intelligence-feed.json \
            apps/web/public/data/intelligence-summary.json \
            apps/web/public/data/feed-export.csv \
            apps/web/public/data/v2-daily-brief.json \
            state/v2-shadow-state.json
          git diff --cached --quiet || git commit -m "data: refresh V1 and V2 publication bundle [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Stale-publication alert
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sha="$(git rev-parse HEAD)"
          branch="${GITHUB_REF_NAME}"
          status="verify-gate-failed"
          note=$(grep -oE 'verify_gate\.[A-Za-z_]+' verify-gate.log 2>/dev/null | head -n 3 | tr '\n' ',' )
          payload=$(printf '{"updated_at": "%s", "head_sha": "%s", "branch": "%s", "status": "%s", "run_url": "%s", "note": "%s"}\n'             "$ts" "$sha" "$branch" "$status" "$RUN_URL" "$note")
          tmp=$(mktemp)
          printf '%s' "$payload" > "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-files --error-unmatch .github/stale-publication-state.json >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout --orphan _stale_alert 2>/dev/null || git checkout -b _stale_alert
            git checkout -B _stale_alert origin/"$branch"
          fi
          mkdir -p .github
          cp "$tmp" .github/stale-publication-state.json
          git add .github/stale-publication-state.json
          git commit -m "data(ops): stale-publication alert $ts" || true
          git push -u origin _stale_alert || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
