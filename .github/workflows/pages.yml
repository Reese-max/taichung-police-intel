name: Refresh and deploy competition demo

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/public/data/source-status.json"
      - "apps/web/public/data/intelligence-feed.json"
      - "apps/web/public/data/intelligence-summary.json"
      - "apps/web/public/data/feed-export.csv"
      - "apps/web/public/data/v2-daily-brief.json"
      - "state/v2-shadow-state.json"
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Demo refresh slot
        required: true
        type: choice
        options: [morning, evening]
        default: evening

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competition-demo-pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      collect: ${{ steps.collect.outcome }}
      v1: ${{ steps.v1.outcome }}
      v2: ${{ steps.v2.outcome }}
      v2_verify: ${{ steps.v2_verify.outcome }}
      verify: ${{ steps.verify.outcome }}
      preserve: ${{ steps.preserve.outcome }}
      pages_upload: ${{ steps.pages_upload.outcome }}
      evidence: ${{ steps.evidence.outcome }}
      evidence_url: ${{ steps.evidence.outputs.artifact-url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select scheduled slot
        if: github.event_name != 'push'
        id: slot
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "30 22 * * *" ]]; then
            echo "value=morning" >> "$GITHUB_OUTPUT"
          else
            echo "value=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore last durable publication state
        id: restore_state
        if: github.event_name != 'push'
        run: python -X utf8 scripts/publication-state-branch.py restore --branch publication-state

      - name: Refresh official-source publication bundle
        id: collect
        if: github.event_name != 'push'
        run: |
          python online_collect.py \
            --slot "${{ steps.slot.outputs.value }}" \
            --demo-output apps/web/public/data/source-status.json \
            --trigger "${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}"

      - name: Verify generated V1 publication bundle
        id: v1
        run: python -X utf8 scripts/verify-publication-bundle.py

      - name: Build persistent V2 daily intelligence
        id: v2
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]] \
             || [[ ! -f state/v2-shadow-state.json ]] \
             || [[ ! -f apps/web/public/data/v2-daily-brief.json ]]; then
            python -X utf8 scripts/build-v2-shadow-brief.py \
              --input apps/web/public/data/intelligence-feed.json \
              --source-status apps/web/public/data/source-status.json \
              --state state/v2-shadow-state.json \
              --output apps/web/public/data/v2-daily-brief.json
          else
            echo "Using the checked-in persistent V2 publication for this code-only push."
          fi

      - name: Verify persistent V2 publication
        id: v2_verify
        run: |
          python -X utf8 scripts/verify-v2-publication.py \
            --feed apps/web/public/data/intelligence-feed.json \
            --status apps/web/public/data/source-status.json \
            --state state/v2-shadow-state.json \
            --brief apps/web/public/data/v2-daily-brief.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run full verification gate and build static site
        id: verify
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee verification.log
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Persist V1 and V2 publication state outside protected main
        id: preserve
        if: github.event_name != 'push'
        env:
          PUBLICATION_SLOT: ${{ steps.slot.outputs.value }}
        run: |
          python -X utf8 scripts/publication-state-branch.py persist \
            --branch publication-state \
            --slot "${{ steps.slot.outputs.value }}"

      - name: Upload Pages artifact
        id: pages_upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Retain publication evidence, including downstream failures
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification.log
            apps/web/public/data/source-status.json
            apps/web/public/data/intelligence-feed.json
            apps/web/public/data/intelligence-summary.json
            apps/web/public/data/feed-export.csv
            apps/web/public/data/v2-daily-brief.json
            state/v2-shadow-state.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publication_outcome:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout reporting code from the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report actual build and deployment outcomes
        run: python scripts/publication-outcome.py
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COLLECT: ${{ needs.build.outputs.collect }}
          V1: ${{ needs.build.outputs.v1 }}
          V2: ${{ needs.build.outputs.v2 }}
          V2_VERIFY: ${{ needs.build.outputs.v2_verify }}
          VERIFY: ${{ needs.build.outputs.verify }}
          PRESERVE: ${{ needs.build.outputs.preserve }}
          PAGES_UPLOAD: ${{ needs.build.outputs.pages_upload }}
          EVIDENCE: ${{ needs.build.outputs.evidence }}
          EVIDENCE_URL: ${{ needs.build.outputs.evidence_url }}
