name: National sync watchdog

on:
  schedule:
    # Observed 7-8 h schedule delay: these fire around 12:00-21:00 UTC, after the deadlines.
    - cron: '30 4 * * *'
    - cron: '30 7 * * *'
    - cron: '30 10 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    if: vars.NATIONAL_SYNC_ENABLED == 'true' && github.repository == 'Reese-max/taichung-police-intel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: national-sync-watchdog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check scheduled sync runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 scripts/national-sync-watchdog.py
