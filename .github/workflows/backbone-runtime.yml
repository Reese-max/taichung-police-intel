name: Pinned GovIntel backbone runtime replay
on:
  push:
    branches: [test/govintel-backbone-runtime-20260917]
    paths:
      - scripts/verify-backbone-runtime.py
      - config/backbone-runtime.v1.json
      - .github/workflows/backbone-runtime.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/verify-backbone-runtime.py
      - config/backbone-runtime.v1.json
      - .github/workflows/backbone-runtime.yml
permissions:
  contents: read
concurrency:
  group: backbone-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Execute pinned component suites and cross-component replay
        run: python scripts/verify-backbone-runtime.py --prepare
        env:
          GIT_TERMINAL_PROMPT: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backbone-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-evidence/backbone/
          if-no-files-found: error
          retention-days: 14
