name: Apply issue 22 collector runtime fixes

on:
  push:
    branches: [devin/issue-14-news-collectors]
    paths:
      - "scripts/apply-issue22-runtime-fixes.py"
      - ".github/workflows/issue-22-runtime-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devin/issue-14-news-collectors
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Apply targeted source patch
        run: python scripts/apply-issue22-runtime-fixes.py

      - name: Run collector regressions
        run: |
          python -X utf8 -m unittest discover -s tests -p "test_news_list_collector.py" -v
          python -X utf8 online_collect.py --self-check

      - name: Commit verified patch and remove one-shot patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online_collect.py tests/test_news_list_collector.py
          git rm scripts/apply-issue22-runtime-fixes.py .github/workflows/issue-22-runtime-patch.yml
          git commit -m "fix(collect): harden canary dates and window completeness (#22)"
          git push origin HEAD:devin/issue-14-news-collectors
