name: Observe candidate public sources

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

concurrency:
  group: candidate-public-source-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [S-019, S-001, S-032, S-033, S-031]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Observe ${{ matrix.source }}
        run: |
          python -X utf8 scripts/candidate-runtime-canary.py \
            --source "${{ matrix.source }}" \
            --output candidate-source-observation.json
      - name: Preserve the observation, including failed-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-source-observation-${{ matrix.source }}-${{ github.run_id }}
          path: candidate-source-observation.json
          if-no-files-found: warn
          retention-days: 21
