name: Observe candidate public sources

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

concurrency:
  group: candidate-public-source-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [S-019, S-001, S-032, S-033, S-031]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore previous observation for incremental diff
        uses: actions/cache@v4
        with:
          path: candidate-source-observation.previous.json
          key: candidate-observation-${{ matrix.source }}-${{ github.run_id }}
          restore-keys: candidate-observation-${{ matrix.source }}-
      - name: Observe ${{ matrix.source }}
        shell: bash
        env:
          GOVINTEL_CANDIDATE_SOURCE: ${{ matrix.source }}
        run: |
          budget_args=()
          # S019's official 25-page archive was actually traversed Oct 7.
          # Bound its daily verification explicitly; other sources keep defaults.
          if [[ "$GOVINTEL_CANDIDATE_SOURCE" == "S-019" ]]; then
            budget_args=(--list-page-limit 30 --http-call-limit 32)
          fi
          python -X utf8 scripts/candidate-runtime-canary.py \
            --source "$GOVINTEL_CANDIDATE_SOURCE" \
            "${budget_args[@]}" \
            --existing candidate-source-observation.previous.json \
            --output candidate-source-observation.json
          cp candidate-source-observation.json candidate-source-observation.previous.json
      - name: Preserve the observation, including failed-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-source-observation-${{ matrix.source }}-${{ github.run_id }}
          path: candidate-source-observation.json
          if-no-files-found: warn
          retention-days: 21
