name: Observe candidate public sources

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

concurrency:
  group: candidate-public-source-observation
  cancel-in-progress: false

jobs:
  observe:
    # Never on pull_request: a public repo must not run untrusted code on the self-hosted host.
    if: github.repository == 'Reese-max/taichung-police-intel' && github.event_name != 'pull_request'
    # S-001 refuses non-Taiwan addresses (docs/govintel/s001-taiwan-relay.md), so
    # only that leg runs on the self-hosted Taiwan runner; the rest stay hosted.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [S-001, S-032, S-031]
        include:
          - source: S-001
            runner: [self-hosted, Windows, xisx-pc]
          - source: S-032
            runner: ubuntu-latest
          - source: S-031
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: matrix.source != 'S-001'
        with:
          python-version: "3.12"
          cache: pip
      - if: matrix.source != 'S-001'
        run: python -m pip install -r requirements.txt
      # The S-001 leg follows national-sync-xisx.yml on xisx-pc: uv provides the
      # toolchain and steps run under cmd, because that host's ExecutionPolicy
      # blocks runner .ps1 step scripts and the first `bash` on its PATH is WSL.
      - uses: astral-sh/setup-uv@v10.3.3
        if: matrix.source == 'S-001'
      - name: Create Python environment
        if: matrix.source == 'S-001'
        shell: cmd
        run: uv venv --python 3.12 .venv
      - name: Install Python dependencies
        if: matrix.source == 'S-001'
        shell: cmd
        run: uv pip install --python .venv -r requirements.txt
      - name: Restore previous observation for incremental diff
        uses: actions/cache@v4
        with:
          path: candidate-source-observation.previous.json
          key: candidate-observation-${{ matrix.source }}-${{ github.run_id }}
          restore-keys: candidate-observation-${{ matrix.source }}-
      - name: Observe ${{ matrix.source }}
        if: matrix.source != 'S-001'
        shell: bash
        env:
          GOVINTEL_CANDIDATE_SOURCE: ${{ matrix.source }}
        run: |
          python -X utf8 scripts/candidate-runtime-canary.py \
            --source "$GOVINTEL_CANDIDATE_SOURCE" \
            --existing candidate-source-observation.previous.json \
            --output candidate-source-observation.json
          cp candidate-source-observation.json candidate-source-observation.previous.json
      - name: Observe ${{ matrix.source }} from Taiwan
        if: matrix.source == 'S-001'
        shell: cmd
        env:
          GOVINTEL_CANDIDATE_SOURCE: ${{ matrix.source }}
        run: >-
          .venv\Scripts\python.exe -X utf8 scripts/candidate-runtime-canary.py
          --source %GOVINTEL_CANDIDATE_SOURCE%
          --existing candidate-source-observation.previous.json
          --output candidate-source-observation.json
          && copy /Y candidate-source-observation.json candidate-source-observation.previous.json
      - name: Preserve the observation, including failed-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-source-observation-${{ matrix.source }}-${{ github.run_id }}
          path: candidate-source-observation.json
          if-no-files-found: warn
          retention-days: 21
