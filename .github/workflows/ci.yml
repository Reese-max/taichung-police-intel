name: Verify pull requests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/public/data/source-status.json"
      - "apps/web/public/data/intelligence-feed.json"
      - "apps/web/public/data/intelligence-summary.json"
      - "apps/web/public/data/feed-export.csv"
      - "apps/web/public/data/v2-daily-brief.json"
      - "state/v2-shadow-state.json"
      - "state/v2-handoff-state.json"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/govintel_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: govintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d govintel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Check source contract drift implementation
        run: python -X utf8 scripts/schema_drift.py --self-check

      - name: Build machine-readable system health receipt
        run: python -X utf8 scripts/system-health.py --output apps/web/public/data/system-health.json

      - name: Run full verification gate
        run: npm run check

      - name: Verify generated V1 publication bundle
        run: python -X utf8 scripts/verify-publication-bundle.py

      - name: Run V2 time and item-diff regression tests
        run: python -X utf8 -m unittest discover -s tests -p "test_v2_semantics.py" -v

      - name: Build conservative V2 baseline publication
        run: |
          rm -f /tmp/v2-shadow-state.json /tmp/v2-handoff-state.json /tmp/v2-shadow-brief.json
          python -X utf8 scripts/build-v2-shadow-brief.py \
            --input apps/web/public/data/intelligence-feed.json \
            --source-status apps/web/public/data/source-status.json \
            --state /tmp/v2-shadow-state.json \
            --handoff-state /tmp/v2-handoff-state.json \
            --output /tmp/v2-shadow-brief.json \
            --reset-baseline

      - name: Verify V2 baseline publication
        run: |
          python -X utf8 scripts/verify-v2-publication.py \
            --feed apps/web/public/data/intelligence-feed.json \
            --status apps/web/public/data/source-status.json \
            --state /tmp/v2-shadow-state.json \
            --handoff-state /tmp/v2-handoff-state.json \
            --brief /tmp/v2-shadow-brief.json
          python -X utf8 -c 'import json; p="/tmp/v2-shadow-brief.json"; d=json.load(open(p, encoding="utf-8")); o=d["overview"]; assert o["current_change_count"] == 0; print("V2_SHADOW_BASELINE_OK archive={} legacy={}".format(o["archive_total"], o["legacy_home_candidate_count"]))'

      - name: Verify web tests when detected changes exceed the display cap
        shell: bash
        run: |
          cp apps/web/public/data/intelligence-feed.json /tmp/v2-regression-feed.json
          cp state/v2-shadow-state.json /tmp/v2-regression-state.json
          cp state/v2-handoff-state.json /tmp/v2-regression-handoff-state.json
          python -X utf8 -c 'import json; p="/tmp/v2-regression-feed.json"; d=json.load(open(p, encoding="utf-8")); assert len(d["items"]) >= 24; [(item.__setitem__("title", item["title"] + "（排程回歸測試）")) for item in d["items"][:24]]; json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)'
          python -X utf8 scripts/build-v2-shadow-brief.py \
            --input /tmp/v2-regression-feed.json \
            --source-status apps/web/public/data/source-status.json \
            --state /tmp/v2-regression-state.json \
            --handoff-state /tmp/v2-regression-handoff-state.json \
            --output /tmp/v2-regression-brief.json
          cp /tmp/v2-regression-feed.json apps/web/public/data/intelligence-feed.json
          cp /tmp/v2-regression-brief.json apps/web/public/data/v2-daily-brief.json
          pushd apps/web
          GOVINTEL_SKIP_DIRTY_FIXTURE_RUNTIME=1 node --test --test-concurrency=1 tests/*.test.mjs
          popd
          python -X utf8 -c 'import json; d=json.load(open("/tmp/v2-regression-brief.json", encoding="utf-8")); displayed=len(d["priority_items"])+len(d["tracking_items"])+len(d["other_changes"]); assert d["overview"]["current_change_count"] == 24; assert displayed == 23; print("V2_WEB_DISPLAY_CAP_OK changes=24 displayed=23")'

      - name: Verify publication outcome and safe summary rendering
        shell: bash
        run: |
          python -X utf8 -m unittest discover -s tests -p "test_publication_outcome.py" -v
          echo "PUBLICATION_OUTCOME_SUMMARY_OK"

      - name: Verify protected-main publication state lifecycle
        run: |
          python -X utf8 -m unittest discover -s tests -p "test_publication_state_branch.py" -v
          echo "PUBLICATION_STATE_BRANCH_OK"

  runtime-browser:
    name: Verify current checkout with Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Use an independent checkout: the regression job intentionally mutates
      # publication fixtures, which cannot become this lane's build baseline.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install locked browser tooling
        run: npm ci --no-audit --no-fund

      - name: Install matching Chromium and system libraries
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Require an unchanged checkout
        run: |
          python -X utf8 - <<'PY'
          import subprocess
          dirty = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          if dirty:
              raise SystemExit("Runtime browser checkout must be clean:\n" + dirty)
          PY

      - name: Verify legacy and v6 browser flows on the same build
        shell: bash
        run: |
          govintel_chromium_path="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$govintel_chromium_path"
          python -X utf8 scripts/verify-current-checkout.py \
            --mode full \
            --chrome-path "$govintel_chromium_path" \
            --output "$RUNNER_TEMP/govintel-runtime-evidence"

      - name: Preserve explicit status when setup prevented execution
        if: ${{ always() }}
        run: |
          python -X utf8 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "govintel-runtime-evidence" / "receipt.json"
          if not output.exists():
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps({
                  "schema_version": 1,
                  "status": "NOT_RUN",
                  "code_sha": os.environ.get("GITHUB_SHA"),
                  "execution_scope": "CURRENT_CHECKOUT_BROWSER_CI_SETUP",
                  "reason": "CI setup or verifier startup failed before a runtime receipt was produced",
                  "production_verified": False,
                  "not_run": [{"id": "v6_browser_e2e", "status": "NOT_RUN"}],
              }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload runtime receipts, logs and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: govintel-current-checkout-browser-${{ github.sha }}
          path: ${{ runner.temp }}/govintel-runtime-evidence
          if-no-files-found: warn
          retention-days: 14
