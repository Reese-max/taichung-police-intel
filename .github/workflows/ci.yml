name: Verify pull requests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/public/data/source-status.json"
      - "apps/web/public/data/intelligence-feed.json"
      - "apps/web/public/data/intelligence-summary.json"
      - "apps/web/public/data/feed-export.csv"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Run full verification gate
        run: npm run check

      - name: Verify generated publication bundle
        run: python -X utf8 scripts/verify-publication-bundle.py

      - name: Run V2 time and item-diff regression tests
        run: python -X utf8 -m unittest discover -s tests -p "test_v2_semantics.py" -v

      - name: Build conservative V2 shadow comparison
        run: |
          rm -f /tmp/v2-shadow-state.json /tmp/v2-shadow-brief.json
          python -X utf8 scripts/build-v2-shadow-brief.py \
            --state /tmp/v2-shadow-state.json \
            --output /tmp/v2-shadow-brief.json \
            --reset-baseline
          python -X utf8 -c 'import json; p="/tmp/v2-shadow-brief.json"; d=json.load(open(p, encoding="utf-8")); o=d["overview"]; assert o["current_change_count"] == 0; print("V2_SHADOW_BASELINE_OK archive={} legacy={}".format(o["archive_total"], o["legacy_home_candidate_count"]))'
